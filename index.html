<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>尊重旗徽・互動點讀書 - 認識國旗國徽區旗區徽與國歌</title>
  <style>
    :root {
      --bg-color: #090C12;
      --card-bg: #181E29;
      --card-border: #FFFF00;
      --text-color: #FFFF00;
      --subtext-color: #FFFFFF;
      --accent-color: #00FF66;
      --panel-bg: #16181F;
      --border-color: #444854;
    }

    body.light-theme {
      --bg-color: #F2F5FA;
      --card-bg: #FFFFFF;
      --card-border: #002868;
      --text-color: #002868;
      --subtext-color: #111111;
      --accent-color: #009933;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    #main-container, #main-container * {
      touch-action: manipulation;
    }

    /* === 頂部模式切換與狀態欄 === */
    #top-bar {
      position: fixed;
      top: 10px;
      left: 72px;
      right: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 40;
      gap: 10px;
    }

    .mode-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .mode-tab-btn {
      background: var(--card-bg);
      color: var(--subtext-color);
      border: 4px solid var(--card-border);
      border-radius: 22px;
      padding: 8px 20px;
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.2s ease;
    }

    .mode-tab-btn.active {
      background: #FFFF00;
      color: #000000;
      border-color: #FFFF00;
      box-shadow: 0 0 20px rgba(255, 255, 0, 0.55);
    }

    .mode-tab-btn:active {
      transform: scale(0.95);
    }

    #replay-speech-btn {
      background: #00E5FF;
      color: #000000;
      border: 3px solid #000000;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }

    #replay-speech-btn:active {
      transform: scale(0.95);
    }

    /* === 教師設定按鈕（左上角齒輪） === */
    #teacher-trigger {
      position: fixed;
      top: 10px;
      left: 12px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(80, 85, 95, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 150;
      cursor: pointer;
    }

    #teacher-trigger svg {
      width: 24px;
      height: 24px;
      fill: #FFFFFF;
      pointer-events: none;
    }

    /* === 主舞台 === */
    #main-container {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 68px 16px 16px 16px;
      gap: 12px;
      overflow: hidden;
    }

    /* 頂部語音字幕顯示橫幅 */
    #caption-banner {
      width: 100%;
      max-width: 1260px;
      background-color: var(--card-bg);
      border: 5px solid var(--card-border);
      border-radius: 22px;
      padding: 10px 20px;
      text-align: center;
      font-size: clamp(1.25rem, 2.4vw, 1.95rem);
      font-weight: 900;
      color: var(--text-color);
      line-height: 1.35;
      flex-shrink: 0;
    }

    /* =========================================
       模式一：互動點讀書網格（6 張有聲大圖卡）
       ========================================= */
    #talking-book-view {
      width: 100%;
      max-width: 1260px;
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: clamp(12px, 2vw, 22px);
    }

    @media (max-width: 820px) {
      #talking-book-view {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(3, 1fr);
      }
      #main-container {
        padding-top: 104px;
      }
    }

    .talk-card {
      background-color: var(--card-bg);
      border: 6px solid #00E5FF;
      border-radius: 26px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
      transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      min-height: 0;
      overflow: hidden;
    }

    .talk-card:active {
      transform: scale(0.96);
    }

    /* 點讀發聲中發光效果 */
    .talk-card.speaking-active {
      border-color: #00FF66 !important;
      background-color: #1F3329 !important;
      transform: scale(1.03);
      box-shadow: 0 0 42px rgba(0, 255, 102, 0.9);
    }

    body.light-theme .talk-card.speaking-active {
      background-color: #DCFCE7 !important;
    }

    .talk-card-graphic {
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .talk-card-graphic svg {
      width: 100%;
      height: 100%;
      max-height: 100%;
    }

    .talk-card-label {
      font-size: clamp(1.15rem, 2.1vw, 1.65rem);
      font-weight: 900;
      color: var(--subtext-color);
      margin-top: 6px;
      text-align: center;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* =========================================
       模式二：小測試選擇題視圖
       ========================================= */
    #quiz-view {
      width: 100%;
      max-width: 1260px;
      flex: 1;
      min-height: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    #quiz-illustration-box {
      width: 100%;
      max-width: 680px;
      flex: 1;
      min-height: 0;
      background-color: #131B2E;
      border: 7px solid #00E5FF;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    body.light-theme #quiz-illustration-box {
      background-color: #E8F4FF;
      border-color: #002868;
    }

    #quiz-illustration-box svg {
      width: 100%;
      height: 100%;
      max-height: 100%;
    }

    /* 兩個大幅分開的左右選項 */
    #quiz-choices-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: clamp(48px, 10vw, 150px);
      flex-shrink: 0;
    }

    .choice-btn {
      flex: 1;
      max-width: 44%;
      background-color: var(--card-bg);
      border: 8px solid var(--btn-accent, #FFFF00);
      border-radius: 28px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      transition: transform 0.15s ease, background-color 0.2s ease, opacity 0.25s ease;
      text-align: left;
    }

    @media (max-width: 760px) {
      #quiz-choices-row {
        flex-direction: column;
        gap: 20px;
      }
      .choice-btn {
        max-width: 100%;
      }
    }

    .choice-btn:active {
      transform: scale(0.96);
    }

    .choice-btn.reading-now {
      background-color: #FFF59D !important;
      border-color: #FFFFFF !important;
      transform: scale(1.04);
      box-shadow: 0 0 46px rgba(255, 255, 0, 0.95);
    }

    .choice-btn.reading-now .choice-text {
      color: #000000 !important;
    }

    .choice-btn.correct-selected {
      background-color: #00FF66 !important;
      border-color: #FFFFFF !important;
      transform: scale(1.04);
      box-shadow: 0 0 48px rgba(0, 255, 102, 0.95);
    }

    .choice-btn.correct-selected .choice-text {
      color: #000000 !important;
    }

    .choice-btn.faded-out {
      opacity: 0.22;
      pointer-events: none;
    }

    .choice-btn.gentle-shake {
      animation: gentleShake 0.45s ease;
      border-color: #FF453A !important;
    }

    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      50% { transform: translateX(10px); }
      75% { transform: translateX(-6px); }
    }

    .choice-icon {
      font-size: clamp(2.4rem, 4.5vw, 3.6rem);
      line-height: 1;
      flex-shrink: 0;
    }

    .choice-text {
      font-size: clamp(1.2rem, 2.2vw, 1.75rem);
      font-weight: 900;
      color: var(--subtext-color);
      line-height: 1.35;
    }

    /* 下一題特大按鈕 */
    #next-question-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: none;
    }

    #next-question-btn {
      background: #00FF66;
      color: #000000;
      border: 5px solid #000000;
      border-radius: 28px;
      padding: 14px 38px;
      font-size: clamp(1.35rem, 2.5vw, 1.9rem);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 34px rgba(0, 255, 102, 0.95);
    }

    /* === 教師設定面板 === */
    #teacher-panel {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.86);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 14px;
    }

    .panel-card {
      background-color: var(--panel-bg);
      color: #FFFFFF;
      width: 100%;
      max-width: 720px;
      border-radius: 22px;
      border: 2px solid var(--border-color);
      padding: 22px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 1.35rem;
      color: #FFFF00;
    }

    .setting-group {
      margin-bottom: 18px;
    }

    .setting-group label {
      display: block;
      font-weight: 800;
      margin-bottom: 8px;
      font-size: 1.05rem;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .opt-btn {
      background: #2A2E3B;
      color: #FFFFFF;
      border: 2px solid #484E60;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
    }

    .opt-btn.active {
      background: #FFFF00;
      color: #000000;
      border-color: #FFFF00;
    }

    .btn-close {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 900;
      background: #00FF66;
      color: #000000;
      border: none;
      cursor: pointer;
    }

    .particle {
      position: fixed;
      pointer-events: none;
      z-index: 70;
      font-size: 2.2rem;
    }
  </style>
</head>
<body>

  <!-- 左上角教師設定 -->
  <button type="button" id="teacher-trigger" title="教師設定">

    </svg>
  </button>

  <!-- 頂部模式切換欄 -->
  <div id="top-bar">
    <div class="mode-tabs">
      <button type="button" class="mode-tab-btn active" id="tab-book-btn">📖 點讀書（一撳即聽）</button>
      <button type="button" class="mode-tab-btn" id="tab-quiz-btn">❓ 小測試選擇題</button>
    </div>
    <button type="button" id="replay-speech-btn">🔊 再讀一次</button>
  </div>

  <!-- 主舞台 -->
  <div id="main-container">
    <div id="caption-banner">👆 撳任何一張圖卡，一齊聽下國旗、國徽、區旗、區徽同國歌啦！</div>

    <!-- 模式一：點讀書網格 -->
    <div id="talking-book-view"></div>

    <!-- 模式二：小測試選擇題 -->
    <div id="quiz-view">
      <div id="quiz-illustration-box"></div>
      <div id="quiz-choices-row"></div>
    </div>
  </div>

  <!-- 過關後下一題按钮 -->
  <div id="next-question-bar">
    <button type="button" id="next-question-btn">➡️ 下一題</button>
  </div>

  <!-- 教師設定面板 -->
  <div id="teacher-panel">
    <div class="panel-card">
      <div class="panel-header">
        <h2>👩‍🏫 尊重旗徽・互動點讀書設定</h2>
      </div>

      <div class="setting-group">
        <label>1. 畫面背景高對比主題</label>
        <div class="btn-group" data-setting="theme">
          <button type="button" class="opt-btn active" data-val="dark">深黑高對比背景（低視能首選）</button>
          <button type="button" class="opt-btn" data-val="light">亮白高對比背景（課室大螢幕投影推薦）</button>
        </div>
      </div>

      <div class="setting-group">
        <label>2. 小測試答對後跳去下一題方式</label>
        <div class="btn-group" data-setting="advanceMode">
          <button type="button" class="opt-btn active" data-val="manual">手動按「➡️ 下一題」按鈕（方便老師講解）</button>
          <button type="button" class="opt-btn" data-val="auto4">答對後停留 4 秒自動下一題</button>
        </div>
      </div>

      <button type="button" class="btn-close" id="close-panel-btn">儲存並返回</button>
    </div>
  </div>

    // === 音效與《義勇軍進行曲》雄壯號角前奏合成器 ===
    let audioCtx = null;

    function initAudio() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
    }

    // 播放《義勇軍進行曲》標誌性號角起音（G4 - C5 - E5 - G5 - E5 - C5 - G5）
    function playNationalAnthemIntro(onFinish) {
      initAudio();
      if (!audioCtx) {
        if (onFinish) onFinish();
        return;
      }
      try {
        // 軍號節奏：起來！不願做奴隸的人們！前奏號角音型
        const notes = [
          { freq: 392.00, time: 0.00, dur: 0.22 }, // G4
          { freq: 523.25, time: 0.25, dur: 0.35 }, // C5
          { freq: 659.25, time: 0.65, dur: 0.22 }, // E5
          { freq: 783.99, time: 0.90, dur: 0.42 }, // G5
          { freq: 659.25, time: 1.38, dur: 0.20 }, // E5
          { freq: 523.25, time: 1.62, dur: 0.22 }, // C5
          { freq: 783.99, time: 1.90, dur: 0.65 }  // G5
        ];

        notes.forEach(n => {
          const start = audioCtx.currentTime + n.time;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(n.freq, start);

          // 柔和低通濾波模擬銅管號角溫暖音色
          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1600, start);

          gain.gain.setValueAtTime(0.01, start);
          gain.gain.linearRampToValueAtTime(0.18, start + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, start + n.dur);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(start);
          osc.stop(start + n.dur + 0.02);
        });

        if (onFinish) {
          setTimeout(onFinish, 2650);
        }
      } catch (e) {
        if (onFinish) onFinish();
      }
    }

    function playSuccessChime() {
      initAudio();
      if (!audioCtx) return;
      try {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const now = audioCtx.currentTime + idx * 0.08;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.38);
        });
      } catch (e) {}
    }

    function playGentleErrorTone() {
      initAudio();
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(240, now);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.25);

    }

    // === 廣東話語音引擎 ===
    let cantoneseVoice = null;
    let speechTimer = null;
    let fallbackCallbackTimer = null;

    function loadCantoneseVoice() {
      try {
        if (!('speechSynthesis' in window)) return;
        const voices = window.speechSynthesis.getVoices();
        cantoneseVoice =
          voices.find(v => v.lang === 'zh-HK' || v.lang === 'zh_HK') ||
          voices.find(v => v.lang.toLowerCase().includes('hk') || v.name.toLowerCase().includes('cantonese') || v.name.includes('粵語') || v.name.includes('廣東話')) ||
          null;
      } catch (e) {}
    }

    try {
      if ('speechSynthesis' in window) {
        loadCantoneseVoice();
        window.speechSynthesis.onvoiceschanged = loadCantoneseVoice;
      }
    } catch (e) {}

    function speakCantonese(text, onComplete) {
      runtime.lastSpokenText = text;
      if (speechTimer) clearTimeout(speechTimer);
      if (fallbackCallbackTimer) clearTimeout(fallbackCallbackTimer);

      if (!('speechSynthesis' in window) || !text) {
        if (onComplete) setTimeout(onComplete, 900);
        return;
      }

      try { window.speechSynthesis.cancel(); } catch (e) {}

      let callbackFired = false;
      const fireOnce = () => {
        if (callbackFired) return;
        callbackFired = true;
        if (fallbackCallbackTimer) clearTimeout(fallbackCallbackTimer);
        if (onComplete) onComplete();
      };

      const estimatedMs = Math.max(1600, String(text).length * 240 + 700);
      if (onComplete) {
        fallbackCallbackTimer = setTimeout(fireOnce, estimatedMs);
      }

      speechTimer = setTimeout(() => {
        try {
          if (window.speechSynthesis.paused) window.speechSynthesis.resume();
          const utter = new SpeechSynthesisUtterance(String(text));
          utter.lang = 'zh-HK';
          if (cantoneseVoice) utter.voice = cantoneseVoice;
          utter.rate = 0.88;
          utter.pitch = 1.15;
          utter.onend = () => setTimeout(fireOnce, 450);
          utter.onerror = () => setTimeout(fireOnce, 450);
          window.speechSynthesis.speak(utter);
        } catch (err) {
          fireOnce();
        }
      }, 50);
    }

          if (card.playAnthem) {
            try { window.speechSynthesis.cancel(); } catch (e) {}
            playNationalAnthemIntro(() => {
              speakCantonese(card.speech, () => {
                el.classList.remove('speaking-active');
              });

          } else {
            speakCantonese(card.speech, () => {

            });
          }
        });
        talkingBookView.appendChild(el);

    // === 初始化模式二：小測試選擇題 ===
    function loadQuizQuestion() {
      if (runtime.autoNextTimer) {
        clearTimeout(runtime.autoNextTimer);
        runtime.autoNextTimer = null;

      nextQuestionBar.style.display = 'none';
      runtime.isAnswered = false;
      runtime.isEvaluatingChoice = false;

      if (runtime.quizIndex >= QUIZ_QUESTIONS.length) {
        runtime.quizIndex = 0;
      }

      const q = QUIZ_QUESTIONS[runtime.quizIndex];
      captionBanner.textContent = `❓ 第 ${runtime.quizIndex + 1} / ${QUIZ_QUESTIONS.length} 題：${q.question}`;
      quizIllustrationBox.innerHTML = q.svg;

      const shuffled = [...q.options].sort(() => Math.random() - 0.5);
      const colors = ['#FFFF00', '#00E5FF'];
      quizChoicesRow.innerHTML = '';

      shuffled.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'choice-btn';
        btn.style.setProperty('--btn-accent', colors[idx % colors.length]);
        btn.innerHTML = `
          <div class="choice-icon">${opt.icon}</div>
          <div class="choice-text">${opt.text}</div>
        `;
        btn.addEventListener('click', () => handleQuizChoice(opt, btn, q));
        quizChoicesRow.appendChild(btn);
      });

      if (q.playAnthemOnLoad) {
        playNationalAnthemIntro(() => speakCantonese(q.question));
      } else {
        speakCantonese(q.question);
      }

    function handleQuizChoice(opt, btnEl, q) {
      if (runtime.isAnswered || runtime.isEvaluatingChoice) return;
      initAudio();
      runtime.isEvaluatingChoice = true;

      quizChoicesRow.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('reading-now', 'gentle-shake'));
      btnEl.classList.add('reading-now');
      captionBanner.textContent = `🗣️ 「${opt.text}」`;

      // 先讀出選項內容，讀完先至揭曉對錯
      speakCantonese(opt.spokenText, () => {
        btnEl.classList.remove('reading-now');
        if (opt.isCorrect) {
          runtime.isAnswered = true;
          runtime.isEvaluatingChoice = false;
          btnEl.classList.add('correct-selected');
          quizChoicesRow.querySelectorAll('.choice-btn').forEach(b => {
            if (b !== btnEl) b.classList.add('faded-out');
          });
          playSuccessChime();
          const rect = btnEl.getBoundingClientRect();
          spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);

          captionBanner.textContent = `🌟 ${q.praise}`;
          speakCantonese(q.praise);

          const isLast = (runtime.quizIndex + 1 >= QUIZ_QUESTIONS.length);
          nextQuestionBtn.textContent = isLast ? '🔄 再玩一次選擇題' : '➡️ 下一題';
          nextQuestionBar.style.display = 'block';

          if (state.settings.advanceMode === 'auto4') {
            runtime.autoNextTimer = setTimeout(() => {
              runtime.quizIndex += 1;
              loadQuizQuestion();
            }, 4000);
          }
        } else {
          runtime.isEvaluatingChoice = false;
          playGentleErrorTone();
          btnEl.classList.remove('gentle-shake');
          void btnEl.offsetWidth;
          btnEl.classList.add('gentle-shake');
          captionBanner.textContent = `💡 ${q.retry}`;
          speakCantonese(q.retry);
        }
      });
    }

    nextQuestionBtn.addEventListener('click', () => {
      initAudio();
      runtime.quizIndex += 1;
      loadQuizQuestion();
    });

    function spawnParticles(cx, cy) {
      const symbols = ['⭐', '🇨🇳', '🇭🇰', '🎉', '✨'];
      for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = symbols[i % symbols.length];
        p.style.left = `${cx}px`;
        p.style.top = `${cy}px`;
        document.body.appendChild(p);
        const angle = (Math.PI * 2 * i) / 12;
        const dist = 80 + Math.random() * 130;
        p.animate([
          { transform: 'translate(-50%, -50%) scale(0.8)', opacity: 1 },
          { transform: `translate(calc(-50% + ${Math.cos(angle) * dist}px), calc(-50% + ${Math.sin(angle) * dist - 50}px)) scale(1.3)`, opacity: 0 }
        ], { duration: 800, easing: 'ease-out' }).onfinish = () => p.remove();
      }
    }

    // === 切換「點讀書模式」與「小測試選擇題」 ===
    const tabBookBtn = document.getElementById('tab-book-btn');
    const tabQuizBtn = document.getElementById('tab-quiz-btn');

    tabBookBtn.addEventListener('click', () => {
      initAudio();
      if (runtime.autoNextTimer) clearTimeout(runtime.autoNextTimer);
      nextQuestionBar.style.display = 'none';
      runtime.mode = 'book';
      tabBookBtn.classList.add('active');
      tabQuizBtn.classList.remove('active');
      quizView.style.display = 'none';
      talkingBookView.style.display = 'grid';
      captionBanner.textContent = '👆 撳任何一張圖卡，一齊聽下國旗、國徽、區旗、區徽同國歌啦！';
      speakCantonese('撳任何一張圖卡，一齊聽下國旗、國徽、區旗、區徽同國歌啦！');
    });

    tabQuizBtn.addEventListener('click', () => {
      initAudio();
      runtime.mode = 'quiz';
      runtime.quizIndex = 0;
      tabQuizBtn.classList.add('active');
      tabBookBtn.classList.remove('active');
      talkingBookView.style.display = 'none';
      quizView.style.display = 'flex';
      loadQuizQuestion();
    });

    document.getElementById('replay-speech-btn').addEventListener('click', () => {
      initAudio();
      speakCantonese(runtime.lastSpokenText);
    });

    // === 教師設定面板 ===
    const teacherPanel = document.getElementById('teacher-panel');
    document.getElementById('teacher-trigger').addEventListener('click', () => {
      applySettingsUI();
      teacherPanel.style.display = 'flex';
    });

    document.querySelectorAll('.btn-group').forEach(group => {
      const key = group.dataset.setting;
      group.querySelectorAll('.opt-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          group.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.settings[key] = btn.dataset.val;
          applySettingsUI();
          saveState();
        });
      });
    });

    function applySettingsUI() {
      document.body.classList.toggle('light-theme', state.settings.theme === 'light');
      document.querySelectorAll('.btn-group').forEach(group => {
        const key = group.dataset.setting;
        const val = String(state.settings[key]);
        group.querySelectorAll('.opt-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.val === val);
        });
      });
    }

    document.getElementById('close-panel-btn').addEventListener('click', () => {
      teacherPanel.style.display = 'none';
    });

    // 初始化啟動
    applySettingsUI();
    renderTalkingBook();
  </script>
</body>
</html>
