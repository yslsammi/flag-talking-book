<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>認識國家與香港・官方標準互動點讀書</title>
  <style>
    :root {
      --bg-color: #090C12;
      --card-bg: #181E29;
      --card-border: #FFFF00;
      --text-color: #FFFF00;
      --subtext-color: #FFFFFF;
      --panel-bg: #16181F;
      --border-color: #444854;
    }

    body.light-theme {
      --bg-color: #F2F5FA;
      --card-bg: #FFFFFF;
      --card-border: #002868;
      --text-color: #002868;
      --subtext-color: #111111;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    #main-container, #main-container * {
      touch-action: manipulation;
    }

    #teacher-trigger {
      position: fixed;
      top: 10px;
      left: 12px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(80, 85, 95, 0.88);
      border: 2px solid rgba(255, 255, 255, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 150;
      cursor: pointer;
    }

    #teacher-trigger svg {
      width: 24px;
      height: 24px;
      fill: #FFFFFF;
      pointer-events: none;
    }

    #top-bar {
      position: fixed;
      top: 10px;
      left: 72px;
      right: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 40;
      gap: 10px;
    }

    .mode-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .mode-tab-btn {
      background: var(--card-bg);
      color: var(--subtext-color);
      border: 4px solid var(--card-border);
      border-radius: 22px;
      padding: 8px 20px;
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      font-weight: 900;
      cursor: pointer;
    }

    .mode-tab-btn.active {
      background: #FFFF00;
      color: #000000;
      border-color: #FFFF00;
      box-shadow: 0 0 18px rgba(255, 255, 0, 0.55);
    }

    #replay-speech-btn {
      background: #00E5FF;
      color: #000000;
      border: 3px solid #000000;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }

    #main-container {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 68px 18px 16px 18px;
      gap: 12px;
      overflow: hidden;
    }

    #caption-banner {
      width: 100%;
      max-width: 1240px;
      background-color: var(--card-bg);
      border: 5px solid var(--card-border);
      border-radius: 22px;
      padding: 10px 20px;
      text-align: center;
      font-size: clamp(1.3rem, 2.6vw, 2.15rem);
      font-weight: 900;
      color: var(--text-color);
      line-height: 1.3;
      flex-shrink: 0;
    }

    /* === 模式一：一次一張特大官方圖點讀 === */
    #single-book-view {
      width: 100%;
      max-width: 1240px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    #single-image-stage {
      position: relative;
      width: 100%;
      max-width: 960px;
      flex: 1;
      min-height: 0;
      background-color: #131B2E;
      border: 8px solid #00E5FF;
      border-radius: 30px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
      transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.15s ease;
    }

    body.light-theme #single-image-stage {
      background-color: #FFFFFF;
      border-color: #002868;
    }

    #single-image-stage.speaking-glow {
      border-color: #00FF66 !important;
      box-shadow: 0 0 46px rgba(0, 255, 102, 0.92);
      transform: scale(1.015);
    }

    /* 強制將所有圖片（包括較小解像度的香港區旗）等比例放大至填滿外框 */
    #single-official-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 12px;
    }

    #missing-img-notice {
      display: none;
      text-align: center;
      color: #FFFFFF;
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.6;
      padding: 20px;
    }

    body.light-theme #missing-img-notice {
      color: #111111;
    }

    #single-controls-bar {
      width: 100%;
      max-width: 1180px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .nav-arrow-btn {
      background: var(--card-bg);
      color: var(--subtext-color);
      border: 5px solid #00E5FF;
      border-radius: 24px;
      padding: 14px 20px;
      font-size: clamp(1.1rem, 2.1vw, 1.55rem);
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }

    .step-action-group {
      flex: 1;
      display: flex;
      justify-content: center;
      gap: clamp(10px, 2.2vw, 24px);
    }

    .big-step-btn {
      flex: 1;
      max-width: 260px;
      border: 5px solid #000000;
      border-radius: 26px;
      padding: 14px 14px;
      font-size: clamp(1.15rem, 2.3vw, 1.75rem);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      white-space: nowrap;
    }

    #btn-speak-name { background: #FFFF00; color: #000000; }
    #btn-speak-feature { background: #00FF66; color: #000000; }
    #btn-play-anthem { background: #FF9F0A; color: #000000; display: none; }

    /* === 模式二：純圖片二選一選擇題 === */
    #quiz-view {
      width: 100%;
      max-width: 1260px;
      flex: 1;
      min-height: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    #image-choices-row {
      width: 100%;
      flex: 1;
      max-height: 540px;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: clamp(60px, 12vw, 180px);
    }

    .img-choice-card {
      flex: 1;
      max-width: 44%;
      background-color: #131B2E;
      border: 9px solid var(--btn-accent, #FFFF00);
      border-radius: 32px;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
      transition: transform 0.16s ease, border-color 0.2s ease, background-color 0.2s ease, opacity 0.25s ease;
    }

    body.light-theme .img-choice-card {
      background-color: #FFFFFF;
    }

    @media (max-width: 760px) {
      #image-choices-row { flex-direction: column; gap: 24px; }
      .img-choice-card { max-width: 100%; }
      #single-controls-bar { flex-wrap: wrap; }
      .step-action-group { order: -1; width: 100%; flex-basis: 100%; }
      .nav-arrow-btn { flex: 1; }
    }

    /* 選擇題左右兩張大圖同樣自動等比例放大填滿卡片 */
    .img-choice-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      border-radius: 10px;
    }

    .img-choice-card.reading-now {
      border-color: #FFFFFF !important;
      background-color: #2B3348 !important;
      transform: scale(1.04);
      box-shadow: 0 0 48px rgba(255, 255, 0, 0.95);
    }

    .img-choice-card.correct-selected {
      border-color: #00FF66 !important;
      background-color: #163826 !important;
      transform: scale(1.05);
      box-shadow: 0 0 54px rgba(0, 255, 102, 0.98);
    }

    .img-choice-card.faded-out {
      opacity: 0.2;
      pointer-events: none;
    }

    .img-choice-card.gentle-shake {
      animation: gentleShake 0.45s ease;
      border-color: #FF453A !important;
    }

    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      50% { transform: translateX(10px); }
      75% { transform: translateX(-6px); }
    }

    #next-question-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: none;
    }

    #next-question-btn {
      background: #00FF66;
      color: #000000;
      border: 5px solid #000000;
      border-radius: 28px;
      padding: 14px 40px;
      font-size: clamp(1.35rem, 2.5vw, 1.9rem);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 34px rgba(0, 255, 102, 0.95);
    }

    /* === 教師設定面板 === */
    #teacher-panel {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 14px;
    }

    .panel-card {
      background-color: var(--panel-bg);
      color: #FFFFFF;
      width: 100%;
      max-width: 900px;
      max-height: 90dvh;
      overflow-y: auto;
      border-radius: 22px;
      border: 2px solid var(--border-color);
      padding: 22px;
    }

    .panel-header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 1.35rem;
      color: #FFFF00;
    }

    .setting-group { margin-bottom: 20px; }
    .setting-group > label {
      display: block;
      font-weight: 800;
      margin-bottom: 8px;
      font-size: 1.05rem;
      color: #EFEFEF;
    }

    .btn-group { display: flex; flex-wrap: wrap; gap: 10px; }
    .opt-btn {
      background: #2A2E3B;
      color: #FFFFFF;
      border: 2px solid #484E60;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    .opt-btn.active {
      background: #FFFF00;
      color: #000000;
      border-color: #FFFF00;
    }

    .custom-card-editor {
      background: #222632;
      border: 1px solid #444854;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .editor-thumb-box {
      width: 110px;
      height: 78px;
      background: #0F131A;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      flex-shrink: 0;
    }

    .editor-thumb-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .editor-fields {
      flex: 1;
      min-width: 240px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .editor-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .editor-row span {
      font-size: 0.88rem;
      font-weight: 800;
      color: #A0A8B8;
      width: 68px;
      flex-shrink: 0;
    }

    .editor-input {
      flex: 1;
      background: #141720;
      color: #FFFFFF;
      border: 1px solid #525866;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .editor-img-btns {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .upload-label-btn {
      background: #00E5FF;
      color: #000000;
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 0.86rem;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
    }

    .restore-default-btn {
      background: #3A3A3C;
      color: #FFFFFF;
      border: none;
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
    }

    .quiz-toggle-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    @media (max-width: 640px) {
      .quiz-toggle-grid { grid-template-columns: 1fr; }
    }

    .quiz-toggle-btn {
      background: #2A2E3B;
      color: #FFFFFF;
      border: 2px solid #484E60;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.92rem;
      font-weight: 800;
      text-align: left;
      cursor: pointer;
    }

    .quiz-toggle-btn.active {
      background: #00FF66;
      color: #000000;
      border-color: #00FF66;
    }

    .btn-close {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      font-size: 1.15rem;
      font-weight: 900;
      background: #FFFF00;
      color: #000000;
      border: none;
      cursor: pointer;
      margin-top: 8px;
    }

    .particle {
      position: fixed;
      pointer-events: none;
      z-index: 70;
      font-size: 2.2rem;
    }
  </style>
</head>
<body>

  <button type="button" id="teacher-trigger" title="教師設定與更換圖片">
    <svg viewBox="0 0 24 24">
      <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
    </svg>
  </button>

  <div id="top-bar">
    <div class="mode-tabs">
      <button type="button" class="mode-tab-btn active" id="tab-book-btn">📖 點讀大圖</button>
      <button type="button" class="mode-tab-btn" id="tab-quiz-btn">🖼️ 二選一練習</button>
    </div>
    <button type="button" id="replay-speech-btn">🔊 再讀一次</button>
  </div>

  <div id="main-container">
    <div id="caption-banner">👆 先撳「🔊 講名稱」，再撳「🔍 講特徵」！</div>

    <div id="single-book-view">
      <div id="single-image-stage" title="撳大圖講名稱">
        <img id="single-official-img" src="" alt="官方標準圖" />
        <div id="missing-img-notice"></div>
      </div>

      <div id="single-controls-bar">
        <button type="button" class="nav-arrow-btn" id="prev-card-btn">⬅️ 上一張</button>
        <div class="step-action-group">
          <button type="button" class="big-step-btn" id="btn-speak-name">🔊 講名稱</button>
          <button type="button" class="big-step-btn" id="btn-speak-feature">🔍 講特徵</button>
          <button type="button" class="big-step-btn" id="btn-play-anthem">🎺 聽國歌</button>
        </div>
        <button type="button" class="nav-arrow-btn" id="next-card-btn">➡️ 下一張</button>
      </div>
    </div>

    <div id="quiz-view">
      <div id="image-choices-row"></div>
    </div>
  </div>

  <div id="next-question-bar">
    <button type="button" id="next-question-btn">➡️ 下一題</button>
  </div>

  <div id="teacher-panel">
    <div class="panel-card">
      <div class="panel-header">
        <h2>👩‍🏫 教師設定、更換圖片與讀白</h2>
      </div>

      <div class="setting-group">
        <label>1. 畫面背景高對比主題</label>
        <div class="btn-group" data-setting="theme">
          <button type="button" class="opt-btn active" data-val="dark">深黑高對比背景（低視能首選）</button>
          <button type="button" class="opt-btn" data-val="light">亮白高對比背景（投影推薦）</button>
        </div>
      </div>

      <div class="setting-group">
        <label>2. 二選一練習答對後跳題方式</label>
        <div class="btn-group" data-setting="advanceMode">
          <button type="button" class="opt-btn active" data-val="manual">手動按「➡️ 下一題」按鈕</button>
          <button type="button" class="opt-btn" data-val="auto4">停留 4 秒自動下一題</button>
        </div>
      </div>

      <div class="setting-group">
        <label>3. 6 張官方圖檔與短句讀白設定</label>
        <div id="custom-cards-manager"></div>
      </div>

      <div class="setting-group">
        <label>4. 勾選今堂「純圖片二選一」練習題目（至少保留 1 題）</label>
        <div class="quiz-toggle-grid" id="quiz-bank-toggles"></div>
      </div>

      <button type="button" class="btn-close" id="close-panel-btn">儲存並返回課堂</button>
    </div>
  </div>

  <script>
    const PROJECT_IMAGES = {
      national_flag: './national_flag.png',
      hk_flag: './hk_flag.png',
      national_emblem: './national_emblem.png',
      hk_emblem: './hk_emblem.png',
      beijing_tiananmen: './beijing.png',
      anthem_etiquette_good: './anthem_good.png'
    };

    const DEFAULT_ITEMS = [
      {
        id: 'national_flag',
        label: '中國國旗',
        expectedFile: 'national_flag.png',
        nameSpeech: '中國國旗。',
        featureSpeech: '紅色底，左上角有五粒黃星。',
        hasAnthemBtn: false
      },
      {
        id: 'hk_flag',
        label: '香港區旗',
        expectedFile: 'hk_flag.png',
        nameSpeech: '香港區旗。',
        featureSpeech: '紅色底，中間有白色紫荊花。',
        hasAnthemBtn: false
      },
      {
        id: 'national_emblem',
        label: '中國國徽',
        expectedFile: 'national_emblem.png',
        nameSpeech: '中國國徽。',
        featureSpeech: '圓形，有天安門同五粒星。',
        hasAnthemBtn: false
      },
      {
        id: 'hk_emblem',
        label: '香港區徽',
        expectedFile: 'hk_emblem.png',
        nameSpeech: '香港區徽。',
        featureSpeech: '圓形，中間有白色紫荊花。',
        hasAnthemBtn: false
      },
      {
        id: 'beijing_tiananmen',
        label: '首都：北京',
        expectedFile: 'beijing.png',
        nameSpeech: '國家的首都，北京。',
        featureSpeech: '北京有天安門廣場。',
        hasAnthemBtn: false
      },
      {
        id: 'anthem_etiquette_good',
        label: '奏唱國歌禮儀',
        expectedFile: 'anthem_good.png',
        nameSpeech: '奏唱國歌的禮儀。',
        featureSpeech: '肅立、手放兩邊、面向國旗、唱國歌。',
        hasAnthemBtn: true
      }
    ];

    const QUIZ_BANK = [
      {
        id: 'q1',
        title: '題 1：邊幅係中國國旗？（國旗 vs 區旗）',
        question: '邊幅係中國國旗？',
        correctId: 'national_flag',
        wrongId: 'hk_flag',

      },
      {

        title: '題 2：邊幅係香港區旗？（區旗 vs 國旗）',
        question: '邊幅係香港區旗？',
        correctId: 'hk_flag',
        wrongId: 'national_flag',
        praise: '答啱啦！呢幅係香港區旗。',
        retry: '再睇下，區旗有白色紫荊花。'
      },
      {
        id: 'q3',
        title: '題 3：邊個係中國國徽？（國徽 vs 區徽）',
        question: '邊個係中國國徽？',
        correctId: 'national_emblem',
        wrongId: 'hk_emblem',
        praise: '答啱啦！呢個係中國國徽。',
        retry: '再睇下，國徽有天安門同五粒星。'
      },
      {
        id: 'q4',
        title: '題 4：邊個係香港區徽？（區徽 vs 國徽）',
        question: '邊個係香港區徽？',
        correctId: 'hk_emblem',
        wrongId: 'national_emblem',
        praise: '答啱啦！呢個係香港區徽。',
        retry: '再睇下，區徽中間有白色紫荊花。'
      },
      {
        id: 'q5',
        title: '題 5：邊幅係國家的首都北京（天安門廣場）？',
        question: '邊幅係國家的首都北京？',
        correctId: 'beijing_tiananmen',
        wrongId: 'hk_flag',
        praise: '答啱啦！北京有天安門廣場。',
        retry: '再睇下，北京有紅色嘅天安門城樓。'
      },
      {
        id: 'q6',
        title: '題 6：邊幅係奏唱國歌的禮儀？',
        question: '邊幅係奏唱國歌的禮儀？',
        correctId: 'anthem_etiquette_good',
        wrongId: 'beijing_tiananmen',
        praise: '答啱啦！肅立、手放兩邊、面向國旗唱國歌。',
        retry: '再睇下，邊幅圖有小朋友企定面向國旗唱歌？'
      }
    ];

    const STORAGE_KEY = 'flag_official_6pngs_v9';
    let state = {
      settings: {
        theme: 'dark',
        advanceMode: 'manual'
      },
      customImages: {},
      customTexts: {},
      enabledQuizzes: ['q1', 'q2', 'q3', 'q4', 'q5', 'q6']
    };

    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved) {
        if (saved.settings) state.settings = { ...state.settings, ...saved.settings };
        if (saved.customImages) state.customImages = saved.customImages;
        if (saved.customTexts) state.customTexts = saved.customTexts;
        if (Array.isArray(saved.enabledQuizzes) && saved.enabledQuizzes.length > 0) {
          state.enabledQuizzes = saved.enabledQuizzes;
        }
      }
    } catch (e) {}

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    function getItemImageSrc(id) {
      return state.customImages[id] || PROJECT_IMAGES[id];
    }

    function getItemSpeech(id, type) {
      const def = DEFAULT_ITEMS.find(i => i.id === id);
      if (!def) return '';
      const custom = state.customTexts[id] || {};
      if (type === 'name') return custom.nameSpeech || def.nameSpeech;
      return custom.featureSpeech || def.featureSpeech;
    }

    const runtime = {
      mode: 'book',
      bookIndex: 0,
      lastSpokenText: '先撳講名稱，再撳講特徵。',
      quizIndex: 0,
      isAnswered: false,
      isEvaluatingChoice: false,
      autoNextTimer: null
    };

    const captionBanner = document.getElementById('caption-banner');
    const singleBookView = document.getElementById('single-book-view');
    const singleImageStage = document.getElementById('single-image-stage');
    const singleOfficialImg = document.getElementById('single-official-img');
    const missingImgNotice = document.getElementById('missing-img-notice');
    const btnPlayAnthem = document.getElementById('btn-play-anthem');
    const quizView = document.getElementById('quiz-view');
    const imageChoicesRow = document.getElementById('image-choices-row');
    const nextQuestionBar = document.getElementById('next-question-bar');
    const nextQuestionBtn = document.getElementById('next-question-btn');

    let audioCtx = null;

    function initAudio() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
    }

    function playNationalAnthemIntro(onFinish) {
      initAudio();
      if (!audioCtx) { if (onFinish) onFinish(); return; }
      try {
        const notes = [
          { freq: 392.00, time: 0.00, dur: 0.22 },
          { freq: 523.25, time: 0.25, dur: 0.35 },
          { freq: 659.25, time: 0.65, dur: 0.22 },
          { freq: 783.99, time: 0.90, dur: 0.42 },
          { freq: 659.25, time: 1.38, dur: 0.20 },
          { freq: 523.25, time: 1.62, dur: 0.22 },
          { freq: 783.99, time: 1.90, dur: 0.65 }
        ];
        notes.forEach(n => {
          const start = audioCtx.currentTime + n.time;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(n.freq, start);
          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1600, start);
          gain.gain.setValueAtTime(0.01, start);
          gain.gain.linearRampToValueAtTime(0.18, start + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, start + n.dur);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(start);
          osc.stop(start + n.dur + 0.02);
        });
        if (onFinish) setTimeout(onFinish, 2650);
      } catch (e) { if (onFinish) onFinish(); }
    }

    function playSuccessChime() {
      initAudio();
      if (!audioCtx) return;
      try {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const now = audioCtx.currentTime + idx * 0.08;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.38);
        });
      } catch (e) {}
    }

    function playGentleErrorTone() {
      initAudio();
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(240, now);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      } catch (e) {}
    }

    let cantoneseVoice = null;
    let speechTimer = null;
    let fallbackCallbackTimer = null;

    function loadCantoneseVoice() {
      try {
        if (!('speechSynthesis' in window)) return;
        const voices = window.speechSynthesis.getVoices();
        cantoneseVoice =
          voices.find(v => v.lang === 'zh-HK' || v.lang === 'zh_HK') ||
          voices.find(v => v.lang.toLowerCase().includes('hk') || v.name.toLowerCase().includes('cantonese') || v.name.includes('粵語') || v.name.includes('廣東話')) ||
          null;
      } catch (e) {}
    }

    try {
      if ('speechSynthesis' in window) {
        loadCantoneseVoice();
        window.speechSynthesis.onvoiceschanged = loadCantoneseVoice;
      }
    } catch (e) {}

    function speakCantonese(text, onComplete) {
      runtime.lastSpokenText = text;
      if (speechTimer) clearTimeout(speechTimer);
      if (fallbackCallbackTimer) clearTimeout(fallbackCallbackTimer);

      if (!('speechSynthesis' in window) || !text) {
        if (onComplete) setTimeout(onComplete, 900);
        return;
      }

      try { window.speechSynthesis.cancel(); } catch (e) {}

      let callbackFired = false;
      const fireOnce = () => {
        if (callbackFired) return;
        callbackFired = true;
        if (fallbackCallbackTimer) clearTimeout(fallbackCallbackTimer);
        if (onComplete) onComplete();
      };

      const estimatedMs = Math.max(1300, String(text).length * 240 + 600);
      if (onComplete) fallbackCallbackTimer = setTimeout(fireOnce, estimatedMs);

      speechTimer = setTimeout(() => {
        try {
          if (window.speechSynthesis.paused) window.speechSynthesis.resume();
          const utter = new SpeechSynthesisUtterance(String(text));
          utter.lang = 'zh-HK';
          if (cantoneseVoice) utter.voice = cantoneseVoice;
          utter.rate = 0.88;
          utter.pitch = 1.15;
          utter.onend = () => setTimeout(fireOnce, 400);
          utter.onerror = () => setTimeout(fireOnce, 400);
          window.speechSynthesis.speak(utter);
        } catch (err) {
          fireOnce();
        }
      }, 50);
    }

    function renderSingleBookCard(autoSpeakName) {
      const item = DEFAULT_ITEMS[runtime.bookIndex];
      singleImageStage.classList.remove('speaking-glow');
      btnPlayAnthem.style.display = item.hasAnthemBtn ? 'inline-block' : 'none';

      singleOfficialImg.style.display = 'block';
      missingImgNotice.style.display = 'none';
      singleOfficialImg.onerror = () => {
        singleOfficialImg.style.display = 'none';
        missingImgNotice.style.display = 'block';
        missingImgNotice.innerHTML = `📁 找不到【${item.label}】圖檔（${item.expectedFile}）<br><span style="font-size:1rem;color:#00E5FF;">請確認該圖片已上傳至 GitHub 專案主目錄，或按左上角 ⚙️ 從相簿選取</span>`;
      };
      singleOfficialImg.src = getItemImageSrc(item.id);
      singleOfficialImg.alt = item.label;

      captionBanner.textContent = `📖 第 ${runtime.bookIndex + 1} / ${DEFAULT_ITEMS.length} 張：請先撳「🔊 講名稱」`;
      if (autoSpeakName) triggerSpeakName();
    }

    function triggerSpeakName() {
      initAudio();
      const item = DEFAULT_ITEMS[runtime.bookIndex];
      const text = getItemSpeech(item.id, 'name');
      singleImageStage.classList.add('speaking-glow');
      captionBanner.textContent = `🔊 ${text}`;
      speakCantonese(text, () => {
        singleImageStage.classList.remove('speaking-glow');
      });
    }

    function triggerSpeakFeature() {
      initAudio();
      const item = DEFAULT_ITEMS[runtime.bookIndex];
      const text = getItemSpeech(item.id, 'feature');
      singleImageStage.classList.add('speaking-glow');
      captionBanner.textContent = `🔍 ${text}`;
      speakCantonese(text, () => {
        singleImageStage.classList.remove('speaking-glow');
      });
    }

    btnPlayAnthem.addEventListener('click', () => {
      initAudio();
      try { window.speechSynthesis.cancel(); } catch (e) {}
      singleImageStage.classList.add('speaking-glow');
      captionBanner.textContent = '🎺 國歌響起！請肅立、手放兩邊、面向國旗！';
      playNationalAnthemIntro(() => {
        singleImageStage.classList.remove('speaking-glow');
      });
    });

    singleImageStage.addEventListener('click', triggerSpeakName);
    document.getElementById('btn-speak-name').addEventListener('click', triggerSpeakName);
    document.getElementById('btn-speak-feature').addEventListener('click', triggerSpeakFeature);

    document.getElementById('prev-card-btn').addEventListener('click', () => {
      initAudio();
      runtime.bookIndex = (runtime.bookIndex - 1 + DEFAULT_ITEMS.length) % DEFAULT_ITEMS.length;
      renderSingleBookCard(true);
    });

    document.getElementById('next-card-btn').addEventListener('click', () => {
      initAudio();
      runtime.bookIndex = (runtime.bookIndex + 1) % DEFAULT_ITEMS.length;
      renderSingleBookCard(true);
    });

    function getActiveQuizList() {
      const list = QUIZ_BANK.filter(q => state.enabledQuizzes.includes(q.id));
      return list.length > 0 ? list : QUIZ_BANK;
    }

    function loadQuizQuestion() {
      if (runtime.autoNextTimer) {
        clearTimeout(runtime.autoNextTimer);
        runtime.autoNextTimer = null;
      }
      nextQuestionBar.style.display = 'none';
      runtime.isAnswered = false;
      runtime.isEvaluatingChoice = false;

      const activeList = getActiveQuizList();
      if (runtime.quizIndex >= activeList.length) runtime.quizIndex = 0;

      const q = activeList[runtime.quizIndex];
      captionBanner.textContent = `❓ 第 ${runtime.quizIndex + 1} / ${activeList.length} 題：${q.question}`;

      const pair = [
        {
          imgId: q.correctId,
          isCorrect: true,
          spokenText: getItemSpeech(q.correctId, 'name')
        },
        {
          imgId: q.wrongId,
          isCorrect: false,
          spokenText: getItemSpeech(q.wrongId, 'name')
        }
      ].sort(() => Math.random() - 0.5);

      const borderColors = ['#FFFF00', '#00E5FF'];
      imageChoicesRow.innerHTML = '';

      pair.forEach((opt, idx) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'img-choice-card';
        card.style.setProperty('--btn-accent', borderColors[idx % borderColors.length]);
        card.innerHTML = `<img src="${getItemImageSrc(opt.imgId)}" alt="圖片選項" />`;
        card.addEventListener('click', () => handleImageChoice(opt, card, q, activeList.length));
        imageChoicesRow.appendChild(card);
      });

      speakCantonese(q.question);
    }

    function handleImageChoice(opt, cardEl, q, totalCount) {
      if (runtime.isAnswered || runtime.isEvaluatingChoice) return;
      initAudio();
      runtime.isEvaluatingChoice = true;

      imageChoicesRow.querySelectorAll('.img-choice-card').forEach(c => c.classList.remove('reading-now', 'gentle-shake'));
      cardEl.classList.add('reading-now');

      captionBanner.textContent = `🗣️ ${opt.spokenText}`;

      speakCantonese(opt.spokenText, () => {
        cardEl.classList.remove('reading-now');
        if (opt.isCorrect) {
          runtime.isAnswered = true;
          runtime.isEvaluatingChoice = false;
          cardEl.classList.add('correct-selected');
          imageChoicesRow.querySelectorAll('.img-choice-card').forEach(c => {
            if (c !== cardEl) c.classList.add('faded-out');
          });
          playSuccessChime();
          const rect = cardEl.getBoundingClientRect();
          spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);

          captionBanner.textContent = `🌟 ${q.praise}`;
          speakCantonese(q.praise);

          const isLast = (runtime.quizIndex + 1 >= totalCount);
          nextQuestionBtn.textContent = isLast ? '🔄 再玩一次' : '➡️ 下一題';
          nextQuestionBar.style.display = 'block';

          if (state.settings.advanceMode === 'auto4') {
            runtime.autoNextTimer = setTimeout(() => {
              runtime.quizIndex += 1;
              loadQuizQuestion();
            }, 4000);
          }
        } else {
          runtime.isEvaluatingChoice = false;
          playGentleErrorTone();
          cardEl.classList.remove('gentle-shake');
          void cardEl.offsetWidth;
          cardEl.classList.add('gentle-shake');
          captionBanner.textContent = `💡 ${q.retry}`;
          speakCantonese(q.retry);
        }
      });
    }

    nextQuestionBtn.addEventListener('click', () => {
      initAudio();
      runtime.quizIndex += 1;
      loadQuizQuestion();
    });

    function spawnParticles(cx, cy) {
      const symbols = ['⭐', '🎉', '✨', '🌟'];
      for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = symbols[i % symbols.length];
        p.style.left = `${cx}px`;
        p.style.top = `${cy}px`;
        document.body.appendChild(p);
        const angle = (Math.PI * 2 * i) / 12;
        const dist = 80 + Math.random() * 130;
        p.animate([
          { transform: 'translate(-50%, -50%) scale(0.8)', opacity: 1 },
          { transform: `translate(calc(-50% + ${Math.cos(angle) * dist}px), calc(-50% + ${Math.sin(angle) * dist - 50}px)) scale(1.3)`, opacity: 0 }
        ], { duration: 800, easing: 'ease-out' }).onfinish = () => p.remove();
      }
    }

    const tabBookBtn = document.getElementById('tab-book-btn');
    const tabQuizBtn = document.getElementById('tab-quiz-btn');

    tabBookBtn.addEventListener('click', () => {
      initAudio();
      if (runtime.autoNextTimer) clearTimeout(runtime.autoNextTimer);
      nextQuestionBar.style.display = 'none';
      runtime.mode = 'book';
      tabBookBtn.classList.add('active');
      tabQuizBtn.classList.remove('active');
      quizView.style.display = 'none';
      singleBookView.style.display = 'flex';
      renderSingleBookCard(false);
    });

    tabQuizBtn.addEventListener('click', () => {
      initAudio();
      runtime.mode = 'quiz';
      runtime.quizIndex = 0;
      tabQuizBtn.classList.add('active');
      tabBookBtn.classList.remove('active');
      singleBookView.style.display = 'none';
      quizView.style.display = 'flex';
      loadQuizQuestion();
    });

    document.getElementById('replay-speech-btn').addEventListener('click', () => {
      initAudio();
      speakCantonese(runtime.lastSpokenText);
    });

    const teacherPanel = document.getElementById('teacher-panel');
    const customCardsManager = document.getElementById('custom-cards-manager');
    const quizBankToggles = document.getElementById('quiz-bank-toggles');

    function renderTeacherManager() {
      customCardsManager.innerHTML = '';
      DEFAULT_ITEMS.forEach(item => {
        const box = document.createElement('div');
        box.className = 'custom-card-editor';
        const inputId = `file_${item.id}`;
        box.innerHTML = `
          <div class="editor-thumb-box">
            <img id="preview_${item.id}" src="${getItemImageSrc(item.id)}" alt="${item.label}" />
          </div>
          <div class="editor-fields">
            <div style="font-weight:900;color:#FFFF00;font-size:0.95rem;">${item.label}（GitHub 檔名：${item.expectedFile}）</div>
            <div class="editor-row">
              <span>講名稱：</span>
              <input type="text" class="editor-input" data-id="${item.id}" data-field="nameSpeech" value="${getItemSpeech(item.id, 'name')}" />
            </div>
            <div class="editor-row">
              <span>講特徵：</span>
              <input type="text" class="editor-input" data-id="${item.id}" data-field="featureSpeech" value="${getItemSpeech(item.id, 'feature')}" />
            </div>
          </div>
          <div class="editor-img-btns">
            <label class="upload-label-btn" for="${inputId}">📁 本機選圖</label>
            <input type="file" id="${inputId}" accept="image/*" style="display:none;" />
            <button type="button" class="restore-default-btn" data-id="${item.id}">用專案圖檔</button>
          </div>
        `;

        box.querySelectorAll('.editor-input').forEach(inp => {
          inp.addEventListener('input', () => {
            const id = inp.dataset.id;
            const field = inp.dataset.field;
            if (!state.customTexts[id]) state.customTexts[id] = {};
            state.customTexts[id][field] = inp.value;
            saveState();
          });
        });

        const fileInput = box.querySelector(`#${inputId}`);
        fileInput.addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            state.customImages[item.id] = ev.target.result;
            saveState();
            document.getElementById(`preview_${item.id}`).src = ev.target.result;
            if (runtime.mode === 'book') renderSingleBookCard(false);
            if (runtime.mode === 'quiz') loadQuizQuestion();
          };
          reader.readAsDataURL(file);
        });

        box.querySelector('.restore-default-btn').addEventListener('click', () => {
          delete state.customImages[item.id];
          saveState();
          document.getElementById(`preview_${item.id}`).src = PROJECT_IMAGES[item.id];
          if (runtime.mode === 'book') renderSingleBookCard(false);
          if (runtime.mode === 'quiz') loadQuizQuestion();
        });

        customCardsManager.appendChild(box);
      });

      quizBankToggles.innerHTML = '';
      QUIZ_BANK.forEach(q => {
        const btn = document.createElement('button');
        btn.type = 'button';
        const isActive = state.enabledQuizzes.includes(q.id);
        btn.className = `quiz-toggle-btn ${isActive ? 'active' : ''}`;
        btn.textContent = `${isActive ? '✅' : '⬜'} ${q.title}`;
        btn.addEventListener('click', () => {
          const idx = state.enabledQuizzes.indexOf(q.id);
          if (idx >= 0) {
            if (state.enabledQuizzes.length <= 1) return;
            state.enabledQuizzes.splice(idx, 1);
          } else {
            state.enabledQuizzes.push(q.id);
          }
          saveState();
          renderTeacherManager();
        });
        quizBankToggles.appendChild(btn);
      });
    }

    document.getElementById('teacher-trigger').addEventListener('click', () => {
      applySettingsUI();
      renderTeacherManager();
      teacherPanel.style.display = 'flex';
    });

    document.querySelectorAll('.btn-group').forEach(group => {
      const key = group.dataset.setting;
      group.querySelectorAll('.opt-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          group.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.settings[key] = btn.dataset.val;
          applySettingsUI();
          saveState();
        });
      });
    });

    function applySettingsUI() {
      document.body.classList.toggle('light-theme', state.settings.theme === 'light');
      document.querySelectorAll('.btn-group').forEach(group => {
        const key = group.dataset.setting;
        const val = String(state.settings[key]);
        group.querySelectorAll('.opt-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.val === val);
        });
      });
    }

    document.getElementById('close-panel-btn').addEventListener('click', () => {
      teacherPanel.style.display = 'none';
      if (runtime.mode === 'book') renderSingleBookCard(false);
      if (runtime.mode === 'quiz') {
        runtime.quizIndex = 0;
        loadQuizQuestion();
      }
    });

    applySettingsUI();
    renderSingleBookCard(false);
  </script>
</body>
