<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>尊重旗徽・官方標準互動點讀書</title>
  <style>
    :root {
      --bg-color: #090C12;
      --card-bg: #181E29;
      --card-border: #FFFF00;
      --text-color: #FFFF00;
      --subtext-color: #FFFFFF;
      --accent-color: #00FF66;
      --panel-bg: #16181F;
      --border-color: #444854;
    }

    body.light-theme {
      --bg-color: #F2F5FA;
      --card-bg: #FFFFFF;
      --card-border: #002868;
      --text-color: #002868;
      --subtext-color: #111111;
      --accent-color: #009933;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    #main-container, #main-container * {
      touch-action: manipulation;
    }

    /* === 頂部模式切換欄 === */
    #top-bar {
      position: fixed;
      top: 10px;
      left: 72px;
      right: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 40;
      gap: 10px;
    }

    .mode-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .mode-tab-btn {
      background: var(--card-bg);
      color: var(--subtext-color);
      border: 4px solid var(--card-border);
      border-radius: 22px;
      padding: 8px 20px;
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      font-weight: 900;
      cursor: pointer;
    }

    .mode-tab-btn.active {
      background: #FFFF00;
      color: #000000;
      border-color: #FFFF00;
      box-shadow: 0 0 18px rgba(255, 255, 0, 0.55);
    }

    .mode-tab-btn:active {
      transform: scale(0.95);
    }

    #replay-speech-btn {
      background: #00E5FF;
      color: #000000;
      border: 3px solid #000000;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }

    /* === 左上角教師設定按鈕 === */
    #teacher-trigger {
      position: fixed;
      top: 10px;
      left: 12px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(80, 85, 95, 0.88);
      border: 2px solid rgba(255, 255, 255, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 150;
      cursor: pointer;
    }

    #teacher-trigger svg {
      width: 24px;
      height: 24px;
      fill: #FFFFFF;
      pointer-events: none;
    }

    /* === 主舞台 === */
    #main-container {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 68px 16px 14px 16px;
      gap: 10px;
      overflow: hidden;
    }

    /* 簡短語音字幕橫幅 */
    #caption-banner {
      width: 100%;
      max-width: 1280px;
      background-color: var(--card-bg);
      border: 5px solid var(--card-border);
      border-radius: 22px;
      padding: 10px 20px;
      text-align: center;
      font-size: clamp(1.35rem, 2.6vw, 2.15rem);
      font-weight: 900;
      color: var(--text-color);
      line-height: 1.3;
      flex-shrink: 0;
    }

    /* =========================================
       模式一：分層點讀書網格（6 張官方圖卡）
       ========================================= */
    #talking-book-view {
      width: 100%;
      max-width: 1280px;
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: clamp(10px, 1.8vw, 20px);
    }

    @media (max-width: 820px) {
      #talking-book-view {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(3, 1fr);
      }
      #main-container {
        padding-top: 104px;
      }
    }

    .talk-card {
      background-color: var(--card-bg);
      border: 6px solid #00E5FF;
      border-radius: 24px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
      min-height: 0;
      overflow: hidden;
    }

    .talk-card.speaking-active {
      border-color: #00FF66 !important;
      box-shadow: 0 0 38px rgba(0, 255, 102, 0.9);
      transform: scale(1.02);
    }

    /* 官方圖片展示區（可點擊先講名稱） */
    .talk-card-img-wrap {
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 4px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
    }

    .talk-card-img-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 6px;
    }

    .talk-card-title {
      font-size: clamp(1.1rem, 1.9vw, 1.5rem);
      font-weight: 900;
      color: var(--subtext-color);
      margin: 4px 0 6px 0;
      text-align: center;
      flex-shrink: 0;
    }

    /* 分層雙按鈕：① 講名稱 / ② 講特徵 */
    .card-step-btns {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      flex-shrink: 0;
    }

    .step-btn {
      border: none;
      border-radius: 14px;
      padding: 9px 6px;
      font-size: clamp(0.95rem, 1.6vw, 1.25rem);
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    .step-btn:active {
      transform: scale(0.94);
    }

    .step-btn-name {
      background: #FFFF00;
      color: #000000;
    }

    .step-btn-feature {
      background: #00FF66;
      color: #000000;
    }

    /* =========================================
       模式二：小測試選擇題視圖
       ========================================= */
    #quiz-view {
      width: 100%;
      max-width: 1280px;
      flex: 1;
      min-height: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    #quiz-illustration-box {
      width: 100%;
      max-width: 640px;
      flex: 1;
      min-height: 0;
      background-color: #131B2E;
      border: 7px solid #00E5FF;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    body.light-theme #quiz-illustration-box {
      background-color: #FFFFFF;
      border-color: #002868;
    }

    #quiz-illustration-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* 左右大幅分開的兩個選項 */
    #quiz-choices-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: clamp(48px, 10vw, 150px);
      flex-shrink: 0;
    }

    .choice-btn {
      flex: 1;
      max-width: 44%;
      background-color: var(--card-bg);
      border: 8px solid var(--btn-accent, #FFFF00);
      border-radius: 28px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      transition: transform 0.15s ease, background-color 0.2s ease, opacity 0.25s ease;
      text-align: left;
    }

    @media (max-width: 760px) {
      #quiz-choices-row {
        flex-direction: column;
        gap: 20px;
      }
      .choice-btn {
        max-width: 100%;
      }
    }

    .choice-btn.reading-now {
      background-color: #FFF59D !important;
      border-color: #FFFFFF !important;
      transform: scale(1.04);
      box-shadow: 0 0 46px rgba(255, 255, 0, 0.95);
    }

    .choice-btn.reading-now .choice-text {
      color: #000000 !important;
    }

    .choice-btn.correct-selected {
      background-color: #00FF66 !important;
      border-color: #FFFFFF !important;
      transform: scale(1.04);
      box-shadow: 0 0 48px rgba(0, 255, 102, 0.95);
    }

    .choice-btn.correct-selected .choice-text {
      color: #000000 !important;
    }

    .choice-btn.faded-out {
      opacity: 0.22;
      pointer-events: none;
    }

    .choice-btn.gentle-shake {
      animation: gentleShake 0.45s ease;
      border-color: #FF453A !important;
    }

    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      50% { transform: translateX(10px); }
      75% { transform: translateX(-6px); }
    }

    .choice-icon {
      font-size: clamp(2.4rem, 4.5vw, 3.6rem);
      line-height: 1;
      flex-shrink: 0;
    }

    .choice-text {
      font-size: clamp(1.25rem, 2.3vw, 1.85rem);
      font-weight: 900;
      color: var(--subtext-color);
      line-height: 1.3;
    }

    /* 下一題特大按鈕 */
    #next-question-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: none;
    }

    #next-question-btn {
      background: #00FF66;
      color: #000000;
      border: 5px solid #000000;
      border-radius: 28px;
      padding: 14px 38px;
      font-size: clamp(1.35rem, 2.5vw, 1.9rem);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 34px rgba(0, 255, 102, 0.95);
    }

    /* === 教師設定與自訂更換圖片面板 === */
    #teacher-panel {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 14px;
      overflow-y: auto;
    }

    .panel-card {
      background-color: var(--panel-bg);
      color: #FFFFFF;
      width: 100%;
      max-width: 840px;
      max-height: 88dvh;
      overflow-y: auto;
      border-radius: 22px;
      border: 2px solid var(--border-color);
      padding: 22px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 1.35rem;
      color: #FFFF00;
    }

    .setting-group {
      margin-bottom: 18px;
    }

    .setting-group label {
      display: block;
      font-weight: 800;
      margin-bottom: 8px;
      font-size: 1.05rem;
      color: #EFEFEF;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .opt-btn {
      background: #2A2E3B;
      color: #FFFFFF;
      border: 2px solid #484E60;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .opt-btn.active {
      background: #FFFF00;
      color: #000000;
      border-color: #FFFF00;
    }

    /* 教師更換圖片清單 */
    .custom-img-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (max-width: 640px) {
      .custom-img-grid {
        grid-template-columns: 1fr;
      }
    }

    .custom-img-item {
      background: #232732;
      border: 1px solid #444854;
      border-radius: 14px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .custom-img-thumb {
      width: 64px;
      height: 48px;
      object-fit: contain;
      background: #0F131A;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .custom-img-info {
      flex: 1;
      min-width: 0;
    }

    .custom-img-name {
      font-weight: 800;
      font-size: 0.95rem;
      margin-bottom: 6px;
    }

    .custom-img-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .upload-label-btn {
      background: #00E5FF;
      color: #000000;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-block;
    }

    .restore-default-btn {
      background: #3A3A3C;
      color: #FFFFFF;
      border: none;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-close {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 900;
      background: #00FF66;
      color: #000000;
      border: none;
      cursor: pointer;
      margin-top: 8px;
    }

    .particle {
      position: fixed;
      pointer-events: none;
      z-index: 70;
      font-size: 2.2rem;
    }
  </style>
</head>
<body>

  <!-- 左上角教師設定 -->
  <button type="button" id="teacher-trigger" title="教師設定與更換圖片">
    <svg viewBox="0 0 24 24">
      <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
    </svg>
  </button>

  <!-- 頂部模式切換欄 -->
  <div id="top-bar">
    <div class="mode-tabs">
      <button type="button" class="mode-tab-btn active" id="tab-book-btn">📖 點讀書</button>
      <button type="button" class="mode-tab-btn" id="tab-quiz-btn">❓ 選擇題</button>
    </div>
    <button type="button" id="replay-speech-btn">🔊 再讀一次</button>
  </div>

  <!-- 主舞台 -->
  <div id="main-container">
    <div id="caption-banner">👆 先撳「🔊 講名稱」，再撳「🔍 講特徵」！</div>

    <!-- 模式一：分層點讀書網格 -->
    <div id="talking-book-view"></div>

    <!-- 模式二：小測試選擇題 -->
    <div id="quiz-view">
      <div id="quiz-illustration-box"></div>
      <div id="quiz-choices-row"></div>
    </div>
  </div>

  <!-- 過關後下一題按鈕 -->
  <div id="next-question-bar">
    <button type="button" id="next-question-btn">➡️ 下一題</button>
  </div>

  <!-- 教師設定與更換圖片面板 -->
  <div id="teacher-panel">
    <div class="panel-card">
      <div class="panel-header">
        <h2>👩‍🏫 教師設定與更換圖片</h2>
      </div>

      <div class="setting-group">
        <label>1. 畫面背景對比主題</label>
        <div class="btn-group" data-setting="theme">
          <button type="button" class="opt-btn active" data-val="dark">深黑高對比背景</button>
          <button type="button" class="opt-btn" data-val="light">亮白高對比背景（投影推薦）</button>
        </div>
      </div>

      <div class="setting-group">
        <label>2. 選擇題答對後跳去下一題方式</label>
        <div class="btn-group" data-setting="advanceMode">
          <button type="button" class="opt-btn active" data-val="manual">手動按「➡️ 下一題」按鈕</button>
          <button type="button" class="opt-btn" data-val="auto4">停留 4 秒自動下一題</button>
        </div>
      </div>

      <div class="setting-group">
        <label>3. 自訂更換圖片（預設已使用官方標準圖檔，老師可隨時從相簿更換）</label>
        <div class="custom-img-grid" id="custom-img-manager"></div>
      </div>

      <button type="button" class="btn-close" id="close-panel-btn">儲存並返回</button>
    </div>
  </div>

  <script>
    // === 官方標準矢量圖檔（Wikimedia Commons 官方標準 SVG，嚴格符合法定設計） ===
    // 1. 中華人民共和國國旗官方標準矢量檔
    // 2. 香港特別行政區區旗官方標準矢量檔
    // 3. 中華人民共和國國徽官方標準矢量檔
    // 4. 香港特別行政區區徽官方標準矢量檔
    // 5. 國歌音樂圖示 / 升旗立正示意圖（內置清晰無文字純圖示，教師亦可隨時自行上傳更換）
    const DEFAULT_IMAGES = {
      national_flag: 'https://upload.wikimedia.org/wikipedia/commons/f/fa/Flag_of_the_People%27s_Republic_of_China.svg',
      hk_flag: 'https://upload.wikimedia.org/wikipedia/commons/5/5b/Flag_of_Hong_Kong.svg',
      national_emblem: 'https://upload.wikimedia.org/wikipedia/commons/a/ab/National_Emblem_of_the_People%27s_Republic_of_China_%282%29.svg',
      hk_emblem: 'https://upload.wikimedia.org/wikipedia/commons/9/90/Regional_Emblem_of_Hong_Kong.svg',
      anthem: 'data:image/svg+xml;utf8,' + encodeURIComponent(`
        <svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg">
          <rect width="320" height="220" rx="18" fill="#1E293B"/>
          <circle cx="115" cy="145" r="22" fill="#FFFF00"/>
          <circle cx="205" cy="128" r="22" fill="#FFFF00"/>
          <path d="M134 145 L134 52 L224 36 L224 128" stroke="#FFFF00" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      `),
      ceremony: 'data:image/svg+xml;utf8,' + encodeURIComponent(`
        <svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg">
          <rect width="320" height="220" rx="18" fill="#0284C7"/>
          <rect y="175" width="320" height="45" fill="#22C55E"/>
          <circle cx="160" cy="58" r="26" fill="#FDE68A" stroke="#000000" stroke-width="4"/>
          <rect x="136" y="88" width="48" height="62" rx="14" fill="#FACC15" stroke="#000000" stroke-width="4"/>
          <line x1="128" y1="92" x2="128" y2="146" stroke="#FDE68A" stroke-width="11" stroke-linecap="round"/>
          <line x1="192" y1="92" x2="192" y2="146" stroke="#FDE68A" stroke-width="11" stroke-linecap="round"/>
          <line x1="148" y1="150" x2="148" y2="185" stroke="#1E293B" stroke-width="12" stroke-linecap="round"/>
          <line x1="172" y1="150" x2="172" y2="185" stroke="#1E293B" stroke-width="12" stroke-linecap="round"/>
        </svg>
      `)
    };

    // === 6 張點讀書圖卡（名稱短句 + 特徵短句分開按掣） ===
    const TALKING_CARDS = [
      {
        id: 'national_flag',
        title: '中國國旗',
        nameSpeech: '中國國旗。',
        featureSpeech: '紅色底，有五粒黃色星星。',
        playAnthem: false
      },
      {
        id: 'hk_flag',

        nameSpeech: '中國國徽。',
        featureSpeech: '圓形，有天安門同五粒星。',
        playAnthem: false
      },
      {
        id: 'hk_emblem',
        title: '香港區徽',
        nameSpeech: '香港區徽。',
        featureSpeech: '圓形，中間有白色紫荊花。',

    // === 小測試選擇題（短句題目 + 短句選項） ===
    const QUIZ_QUESTIONS = [
      {

        praise: '答啱啦！呢幅係中國國旗。',
        retry: '再睇真啲，國旗有五粒黃星。',
        options: [

          { icon: '🇭🇰', text: '香港區旗', spokenText: '香港區旗。', isCorrect: false }
        ]
      },
      {
        question: '邊幅係香港區旗？',
        imgId: 'hk_flag',
        praise: '答啱啦！呢幅係香港區旗。',
        retry: '再睇下，區旗有白色紫荊花。',
        options: [
          { icon: '🇭🇰', text: '香港區旗', spokenText: '香港區旗。', isCorrect: true },
          { icon: '🇨🇳', text: '中國國旗', spokenText: '中國國旗。', isCorrect: false }
        ]
      },
      {

        praise: '答啱啦！呢個係中國國徽。',
        retry: '再睇下，入面有天安門，係國徽。',
        options: [
          { icon: '🏅', text: '中國國徽', spokenText: '中國國徽。', isCorrect: true },
          { icon: '🌸', text: '香港區徽', spokenText: '香港區徽。', isCorrect: false }
        ]
      },
      {
        question: '呢個圓形徽章係咩？',
        imgId: 'hk_emblem',
        praise: '答啱啦！呢個係香港區徽。',
        retry: '再睇下，中間有白色紫荊花。',
        options: [
          { icon: '🌸', text: '香港區徽', spokenText: '香港區徽。', isCorrect: true },
          { icon: '🏅', text: '中國國徽', spokenText: '中國國徽。', isCorrect: false }
        ]
      },
      {
        question: '聽到國歌響起，要點做？',
        imgId: 'anthem',
        playAnthemOnLoad: true,
        praise: '答啱啦！要企定立正唱國歌。',
        retry: '聽到國歌唔可以周圍走，再揀！',
        options: [
          { icon: '🧍‍♂️', text: '企定立正', spokenText: '企定立正。', isCorrect: true },
          { icon: '🏃‍♂️', text: '周圍跑跳', spokenText: '周圍跑跳。', isCorrect: false }
        ]
      },
      {
        question: '點樣先係愛護國旗同區旗？',
        imgId: 'national_flag',
        praise: '答啱啦！雙手捧好，唔整污糟。',
        retry: '旗幟唔可以掉落地，再揀！',
        options: [
          { icon: '👐', text: '雙手捧好', spokenText: '雙手捧好。', isCorrect: true },
          { icon: '🗑️', text: '掉喺地上', spokenText: '掉喺地上。', isCorrect: false }
        ]
      }
    ];

    const STORAGE_KEY = 'flag_talking_book_v2';
    let state = {
      settings: {
        theme: 'dark',
        advanceMode: 'manual'
      },
      customImages: {}
    };

    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved) {
        if (saved.settings) state.settings = { ...state.settings, ...saved.settings };
        if (saved.customImages) state.customImages = saved.customImages;
      }
    } catch (e) {}

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    function getCardImageSrc(id) {
      return state.customImages[id] || DEFAULT_IMAGES[id];
    }

    const runtime = {
      mode: 'book',
      lastSpokenText: '先撳「講名稱」，再撳「講特徵」。',
      quizIndex: 0,
      isAnswered: false,
      isEvaluatingChoice: false,
      autoNextTimer: null
    };

    const captionBanner = document.getElementById('caption-banner');
    const talkingBookView = document.getElementById('talking-book-view');
    const quizView = document.getElementById('quiz-view');
    const quizIllustrationBox = document.getElementById('quiz-illustration-box');
    const quizChoicesRow = document.getElementById('quiz-choices-row');
    const nextQuestionBar = document.getElementById('next-question-bar');
    const nextQuestionBtn = document.getElementById('next-question-btn');

    // === 音效與國歌前奏 ===
    let audioCtx = null;

    function initAudio() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
    }

    function playNationalAnthemIntro(onFinish) {
      initAudio();
      if (!audioCtx) {
        if (onFinish) onFinish();
        return;
      }
      try {
        const notes = [
          { freq: 392.00, time: 0.00, dur: 0.22 },
          { freq: 523.25, time: 0.25, dur: 0.35 },
          { freq: 659.25, time: 0.65, dur: 0.22 },
          { freq: 783.99, time: 0.90, dur: 0.42 },
          { freq: 659.25, time: 1.38, dur: 0.20 },
          { freq: 523.25, time: 1.62, dur: 0.22 },
          { freq: 783.99, time: 1.90, dur: 0.65 }
        ];
        notes.forEach(n => {
          const start = audioCtx.currentTime + n.time;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(n.freq, start);

          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1600, start);

          gain.gain.setValueAtTime(0.01, start);
          gain.gain.linearRampToValueAtTime(0.18, start + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, start + n.dur);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(start);
          osc.stop(start + n.dur + 0.02);
        });
        if (onFinish) setTimeout(onFinish, 2650);
      } catch (e) {
        if (onFinish) onFinish();
      }
    }

    function playSuccessChime() {
      initAudio();
      if (!audioCtx) return;
      try {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const now = audioCtx.currentTime + idx * 0.08;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.38);
        });
      } catch (e) {}
    }

    function playGentleErrorTone() {
      initAudio();
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(240, now);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      } catch (e) {}
    }

    // === 廣東話語音引擎 ===
    let cantoneseVoice = null;
    let speechTimer = null;
    let fallbackCallbackTimer = null;

    function loadCantoneseVoice() {
      try {
        if (!('speechSynthesis' in window)) return;
        const voices = window.speechSynthesis.getVoices();
        cantoneseVoice =
          voices.find(v => v.lang === 'zh-HK' || v.lang === 'zh_HK') ||
          voices.find(v => v.lang.toLowerCase().includes('hk') || v.name.toLowerCase().includes('cantonese') || v.name.includes('粵語') || v.name.includes('廣東話')) ||
          null;
      } catch (e) {}
    }

    try {
      if ('speechSynthesis' in window) {
        loadCantoneseVoice();
        window.speechSynthesis.onvoiceschanged = loadCantoneseVoice;
      }
    } catch (e) {}

    function speakCantonese(text, onComplete) {
      runtime.lastSpokenText = text;
      if (speechTimer) clearTimeout(speechTimer);
      if (fallbackCallbackTimer) clearTimeout(fallbackCallbackTimer);

      if (!('speechSynthesis' in window) || !text) {
        if (onComplete) setTimeout(onComplete, 900);
        return;
      }

      try { window.speechSynthesis.cancel(); } catch (e) {}

      let callbackFired = false;
      const fireOnce = () => {
        if (callbackFired) return;
        callbackFired = true;
        if (fallbackCallbackTimer) clearTimeout(fallbackCallbackTimer);
        if (onComplete) onComplete();
      };

      const estimatedMs = Math.max(1400, String(text).length * 240 + 650);
      if (onComplete) {
        fallbackCallbackTimer = setTimeout(fireOnce, estimatedMs);
      }

      speechTimer = setTimeout(() => {
        try {
          if (window.speechSynthesis.paused) window.speechSynthesis.resume();
          const utter = new SpeechSynthesisUtterance(String(text));
          utter.lang = 'zh-HK';
          if (cantoneseVoice) utter.voice = cantoneseVoice;
          utter.rate = 0.88;
          utter.pitch = 1.15;
          utter.onend = () => setTimeout(fireOnce, 400);
          utter.onerror = () => setTimeout(fireOnce, 400);
          window.speechSynthesis.speak(utter);
        } catch (err) {
          fireOnce();
        }
      }, 50);
    }

    // === 模式一：渲染分層點讀書 ===
    function renderTalkingBook() {
      talkingBookView.innerHTML = '';
      TALKING_CARDS.forEach(card => {
        const el = document.createElement('div');
        el.className = 'talk-card';
        el.innerHTML = `
          <div class="talk-card-img-wrap" title="撳圖片聽名稱">
            <img src="${getCardImageSrc(card.id)}" alt="${card.title}" />
          </div>
          <div class="talk-card-title">${card.title}</div>
          <div class="card-step-btns">
            <button type="button" class="step-btn step-btn-name">🔊 講名稱</button>
            <button type="button" class="step-btn step-btn-feature">🔍 講特徵</button>
          </div>
        `;

        const triggerName = () => {
          initAudio();
          document.querySelectorAll('.talk-card').forEach(c => c.classList.remove('speaking-active'));
          el.classList.add('speaking-active');
          captionBanner.textContent = `🔊 ${card.nameSpeech}`;

          if (card.playAnthem) {
            try { window.speechSynthesis.cancel(); } catch (e) {}
            playNationalAnthemIntro(() => {
              speakCantonese(card.nameSpeech, () => el.classList.remove('speaking-active'));
            });
          } else {
            speakCantonese(card.nameSpeech, () => el.classList.remove('speaking-active'));
          }
        };

        const triggerFeature = () => {
          initAudio();
          document.querySelectorAll('.talk-card').forEach(c => c.classList.remove('speaking-active'));
          el.classList.add('speaking-active');
          captionBanner.textContent = `🔍 ${card.featureSpeech}`;
          speakCantonese(card.featureSpeech, () => el.classList.remove('speaking-active'));
        };

        el.querySelector('.talk-card-img-wrap').addEventListener('click', triggerName);
        el.querySelector('.step-btn-name').addEventListener('click', triggerName);
        el.querySelector('.step-btn-feature').addEventListener('click', triggerFeature);

        talkingBookView.appendChild(el);
      });
    }

    // === 模式二：小測試選擇題 ===
    function loadQuizQuestion() {
      if (runtime.autoNextTimer) {
        clearTimeout(runtime.autoNextTimer);
        runtime.autoNextTimer = null;
      }
      nextQuestionBar.style.display = 'none';
      runtime.isAnswered = false;
      runtime.isEvaluatingChoice = false;

      if (runtime.quizIndex >= QUIZ_QUESTIONS.length) {
        runtime.quizIndex = 0;
      }

      const q = QUIZ_QUESTIONS[runtime.quizIndex];
      captionBanner.textContent = `❓ 第 ${runtime.quizIndex + 1} / ${QUIZ_QUESTIONS.length} 題：${q.question}`;
      quizIllustrationBox.innerHTML = `<img src="${getCardImageSrc(q.imgId)}" alt="題目圖片" />`;

      const shuffled = [...q.options].sort(() => Math.random() - 0.5);
      const colors = ['#FFFF00', '#00E5FF'];
      quizChoicesRow.innerHTML = '';

      shuffled.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'choice-btn';
        btn.style.setProperty('--btn-accent', colors[idx % colors.length]);
        btn.innerHTML = `
          <div class="choice-icon">${opt.icon}</div>
          <div class="choice-text">${opt.text}</div>
        `;
        btn.addEventListener('click', () => handleQuizChoice(opt, btn, q));
        quizChoicesRow.appendChild(btn);
      });

      if (q.playAnthemOnLoad) {
        playNationalAnthemIntro(() => speakCantonese(q.question));
      } else {
        speakCantonese(q.question);
      }
    }

    function handleQuizChoice(opt, btnEl, q) {
      if (runtime.isAnswered || runtime.isEvaluatingChoice) return;
      initAudio();
      runtime.isEvaluatingChoice = true;

      quizChoicesRow.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('reading-now', 'gentle-shake'));
      btnEl.classList.add('reading-now');
      captionBanner.textContent = `🗣️ 「${opt.text}」`;

      speakCantonese(opt.spokenText, () => {
        btnEl.classList.remove('reading-now');
        if (opt.isCorrect) {
          runtime.isAnswered = true;
          runtime.isEvaluatingChoice = false;
          btnEl.classList.add('correct-selected');
          quizChoicesRow.querySelectorAll('.choice-btn').forEach(b => {
            if (b !== btnEl) b.classList.add('faded-out');
          });
          playSuccessChime();
          const rect = btnEl.getBoundingClientRect();
          spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);

          captionBanner.textContent = `🌟 ${q.praise}`;
          speakCantonese(q.praise);

          const isLast = (runtime.quizIndex + 1 >= QUIZ_QUESTIONS.length);
          nextQuestionBtn.textContent = isLast ? '🔄 再玩一次' : '➡️ 下一題';
          nextQuestionBar.style.display = 'block';

          if (state.settings.advanceMode === 'auto4') {
            runtime.autoNextTimer = setTimeout(() => {
              runtime.quizIndex += 1;
              loadQuizQuestion();
            }, 4000);
          }
        } else {
          runtime.isEvaluatingChoice = false;
          playGentleErrorTone();
          btnEl.classList.remove('gentle-shake');
          void btnEl.offsetWidth;
          btnEl.classList.add('gentle-shake');
          captionBanner.textContent = `💡 ${q.retry}`;
          speakCantonese(q.retry);
        }
      });
    }

    nextQuestionBtn.addEventListener('click', () => {
      initAudio();
      runtime.quizIndex += 1;
      loadQuizQuestion();
    });

    function spawnParticles(cx, cy) {
      const symbols = ['⭐', '🇨🇳', '🇭🇰', '🎉', '✨'];
      for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = symbols[i % symbols.length];
        p.style.left = `${cx}px`;
        p.style.top = `${cy}px`;
        document.body.appendChild(p);
        const angle = (Math.PI * 2 * i) / 12;
        const dist = 80 + Math.random() * 130;
        p.animate([
          { transform: 'translate(-50%, -50%) scale(0.8)', opacity: 1 },
          { transform: `translate(calc(-50% + ${Math.cos(angle) * dist}px), calc(-50% + ${Math.sin(angle) * dist - 50}px)) scale(1.3)`, opacity: 0 }
        ], { duration: 800, easing: 'ease-out' }).onfinish = () => p.remove();
      }
    }

    // === 切換「點讀書」與「選擇題」 ===
    const tabBookBtn = document.getElementById('tab-book-btn');
    const tabQuizBtn = document.getElementById('tab-quiz-btn');

    tabBookBtn.addEventListener('click', () => {
      initAudio();
      if (runtime.autoNextTimer) clearTimeout(runtime.autoNextTimer);
      nextQuestionBar.style.display = 'none';
      runtime.mode = 'book';
      tabBookBtn.classList.add('active');
      tabQuizBtn.classList.remove('active');
      quizView.style.display = 'none';
      talkingBookView.style.display = 'grid';
      captionBanner.textContent = '👆 先撳「🔊 講名稱」，再撳「🔍 講特徵」！';
      speakCantonese('先撳講名稱，再撳講特徵。');
    });

    tabQuizBtn.addEventListener('click', () => {
      initAudio();
      runtime.mode = 'quiz';
      runtime.quizIndex = 0;
      tabQuizBtn.classList.add('active');
      tabBookBtn.classList.remove('active');
      talkingBookView.style.display = 'none';
      quizView.style.display = 'flex';
      loadQuizQuestion();
    });

    document.getElementById('replay-speech-btn').addEventListener('click', () => {
      initAudio();
      speakCantonese(runtime.lastSpokenText);
    });

    // === 教師設定面板與自訂圖片上傳管理器 ===
    const teacherPanel = document.getElementById('teacher-panel');
    const customImgManager = document.getElementById('custom-img-manager');

    function renderCustomImageManager() {
      customImgManager.innerHTML = '';
      TALKING_CARDS.forEach(card => {
        const item = document.createElement('div');
        item.className = 'custom-img-item';
        const inputId = `upload_${card.id}`;
        item.innerHTML = `
          <img class="custom-img-thumb" id="thumb_${card.id}" src="${getCardImageSrc(card.id)}" alt="${card.title}" />
          <div class="custom-img-info">
            <div class="custom-img-name">${card.title}</div>
            <div class="custom-img-actions">
              <label class="upload-label-btn" for="${inputId}">📁 更換圖片</label>
              <input type="file" id="${inputId}" accept="image/*" style="display:none;" />
              <button type="button" class="restore-default-btn" data-id="${card.id}">還原官方圖</button>
            </div>
          </div>
        `;

        const fileInput = item.querySelector(`#${inputId}`);
        fileInput.addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            state.customImages[card.id] = ev.target.result;
            saveState();
            document.getElementById(`thumb_${card.id}`).src = ev.target.result;
            renderTalkingBook();
            if (runtime.mode === 'quiz') loadQuizQuestion();
          };
          reader.readAsDataURL(file);
        });

        item.querySelector('.restore-default-btn').addEventListener('click', () => {
          delete state.customImages[card.id];
          saveState();
          document.getElementById(`thumb_${card.id}`).src = DEFAULT_IMAGES[card.id];
          renderTalkingBook();
          if (runtime.mode === 'quiz') loadQuizQuestion();
        });

        customImgManager.appendChild(item);
      });
    }

    document.getElementById('teacher-trigger').addEventListener('click', () => {
      applySettingsUI();
      renderCustomImageManager();
      teacherPanel.style.display = 'flex';
    });

    document.querySelectorAll('.btn-group').forEach(group => {
      const key = group.dataset.setting;
      group.querySelectorAll('.opt-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          group.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.settings[key] = btn.dataset.val;
          applySettingsUI();
          saveState();
        });
      });
    });

    function applySettingsUI() {
      document.body.classList.toggle('light-theme', state.settings.theme === 'light');
      document.querySelectorAll('.btn-group').forEach(group => {
        const key = group.dataset.setting;
        const val = String(state.settings[key]);
        group.querySelectorAll('.opt-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.val === val);
        });
      });
    }

    document.getElementById('close-panel-btn').addEventListener('click', () => {
      teacherPanel.style.display = 'none';
    });

    // 初始化啟動
    applySettingsUI();
    renderTalkingBook();
  </script>
